services:
  # Oprino Fastify API Service (with bundled background worker for 100% free tier)
  - type: web
    name: oprino-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: free
    region: oregon
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: PORT
        value: 3001
      - key: API_PUBLIC_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: APP_PUBLIC_URL
        value: 'https://oprino.vercel.app'
      - key: CORS_ORIGINS
        value: 'https://oprino.vercel.app,https://app.oprino.com'
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET_NAME
        value: oprino-production-media
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
