name: Oprino Staging Cloud Verification

on:
  workflow_dispatch:
    inputs:
      run_live_r2:
        description: 'Execute live Cloudflare R2 storage verification against staging bucket'
        required: true
        type: boolean
        default: true

concurrency:
  group: staging-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-staging-r2-storage:
    name: Verify Isolated Cloudflare R2 Staging Storage
    runs-on: ubuntu-latest
    environment: Staging
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Contracts & Build Services
        run: |
          pnpm turbo generate
          pnpm --filter @oprino/contracts build
          pnpm --filter @oprino/api build

      - name: Execute Live Staging Cloudflare R2 Verification
        run: |
          echo "=================================================================="
          echo "   OPRINO STAGING CLOUD VERIFICATION (FAIL-CLOSED REAL CLOUD)     "
          echo "=================================================================="
          echo "Target Environment: Staging"
          echo "Live R2 Execution Requested: ${{ inputs.run_live_r2 }}"
          
          node --test services/api/dist/cloud-storage.integration.test.js
        env:
          NODE_ENV: production
          APP_ENV: staging
          RUN_LIVE_R2_TESTS: ${{ inputs.run_live_r2 }}
          S3_ENDPOINT: ${{ secrets.STAGING_S3_ENDPOINT }}
          S3_BUCKET_NAME: ${{ secrets.STAGING_S3_BUCKET_NAME }}
          S3_REGION: ${{ secrets.STAGING_S3_REGION || 'auto' }}
          S3_ACCESS_KEY_ID: ${{ secrets.STAGING_S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.STAGING_S3_SECRET_ACCESS_KEY }}
