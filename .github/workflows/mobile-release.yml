name: Oprino Mobile Release APK Build

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/tokens/**'
      - 'packages/contracts/**'
      - '.github/workflows/mobile-release.yml'
  workflow_dispatch:

jobs:
  build-android-release-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Design Tokens & Dart API Client
        run: pnpm turbo generate

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Provision Android Signing Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat <<EOF > apps/mobile/android/key.properties
          storeFile=/home/runner/.android/debug.keystore
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF

      - name: Build Unified Release APK
        run: |
          cd apps/mobile
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: oprino-mobile-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
