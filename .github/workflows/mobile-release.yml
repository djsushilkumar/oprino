name: Oprino Mobile Release APK Build

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/tokens/**'
      - 'packages/contracts/**'
      - '.github/workflows/mobile-release.yml'
  workflow_dispatch:

jobs:
  build-android-release-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Design Tokens & Dart API Client
        run: pnpm turbo generate

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Validate & Provision Production Release Signing Credentials
        run: |
          echo "=================================================================="
          echo "       OPRINO PRODUCTION RELEASE SIGNING CREDENTIALS GATE         "
          echo "=================================================================="
          if [ -z "${{ secrets.OPRINO_RELEASE_KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.OPRINO_RELEASE_KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.OPRINO_RELEASE_KEY_ALIAS }}" ] || [ -z "${{ secrets.OPRINO_RELEASE_KEY_PASSWORD }}" ]; then
            echo "❌ CRITICAL SECURITY GATE VIOLATION: Production release signing secrets are unconfigured or incomplete."
            echo "Required GitHub repository secrets:"
            echo "  - OPRINO_RELEASE_KEYSTORE_BASE64"
            echo "  - OPRINO_RELEASE_KEYSTORE_PASSWORD"
            echo "  - OPRINO_RELEASE_KEY_ALIAS"
            echo "  - OPRINO_RELEASE_KEY_PASSWORD"
            echo "Generating debug keystore for production distribution artifacts is strictly forbidden."
            exit 1
          fi

          mkdir -p ~/.android
          echo "${{ secrets.OPRINO_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > ~/.android/oprino-release.jks

          cat <<EOF > apps/mobile/android/key.properties
          storeFile=/home/runner/.android/oprino-release.jks
          storePassword=${{ secrets.OPRINO_RELEASE_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.OPRINO_RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.OPRINO_RELEASE_KEY_PASSWORD }}
          EOF
          echo "✓ Production release keystore provisioned safely."

      - name: Pre-Build Production Environment Validation
        run: |
          node scripts/verify-production-build-defines.mjs \
            --environment=PRODUCTION \
            --api-url="${{ vars.PRODUCTION_API_URL || 'https://oprino-api.onrender.com' }}"

      - name: Build Unified Production Release APK
        run: |
          cd apps/mobile
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=ENVIRONMENT=PRODUCTION \
            --dart-define=API_BASE_URL="${{ vars.PRODUCTION_API_URL || 'https://oprino-api.onrender.com' }}"

      - name: Verify Production Release Artifacts
        run: |
          node scripts/verify-production-artifacts.mjs

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: oprino-mobile-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
