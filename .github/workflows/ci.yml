name: Oprino Monorepo CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main, 'feat/**', 'docs/**']
  workflow_dispatch:

jobs:
  validate-web-and-services:
    name: Lint, Typecheck, Test & Build (TypeScript)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: oprino_admin
          POSTGRES_PASSWORD: oprino_dev_password
          POSTGRES_DB: oprino_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oprino_admin -d oprino_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Tokens & Contracts
        run: pnpm turbo generate

      - name: Lint
        run: pnpm turbo lint

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Build Web & Services
        run: pnpm turbo build

      - name: Apply Drizzle Migrations & Provision Roles
        run: |
          pnpm --filter @oprino/database migrate
          pnpm --filter @oprino/database provision-roles
        env:
          DATABASE_URL: postgresql://oprino_admin:oprino_dev_password@localhost:5432/oprino_db

      - name: Test
        run: pnpm turbo test
        env:
          DATABASE_URL: postgresql://oprino_admin:oprino_dev_password@localhost:5432/oprino_db
          REDIS_URL: redis://localhost:6379
          BETTER_AUTH_SECRET: oprino_dev_secret_must_be_at_least_32_characters_long_for_security

  validate-mobile:
    name: Flutter Analyze, Test & Android Baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Mobile Flutter Dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Flutter Analyze
        run: |
          cd apps/mobile
          flutter analyze

      - name: Flutter Test
        run: |
          cd apps/mobile
          flutter test

  e2e-smoke-test:
    name: Full End-to-End Smoke Test
    needs: [validate-web-and-services]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: oprino_admin
          POSTGRES_PASSWORD: oprino_dev_password
          POSTGRES_DB: oprino_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oprino_admin -d oprino_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Monorepo
        run: pnpm turbo build

      - name: Apply Drizzle Migrations & Provision Roles
        run: |
          pnpm --filter @oprino/database migrate
          pnpm --filter @oprino/database provision-roles
        env:
          DATABASE_URL: postgresql://oprino_admin:oprino_dev_password@localhost:5432/oprino_db

      - name: Start Services & Execute Smoke Test
        run: |
          pnpm dev &
          sleep 12
          node scripts/smoke_test.mjs
        env:
          DATABASE_URL: postgresql://oprino_admin:oprino_dev_password@localhost:5432/oprino_db
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

