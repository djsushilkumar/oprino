name: oprino_mobile
description: 'Oprino Workforce Operations Mobile Application (Unified Field & Manager App)'
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Architecture
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Network & Generated API Client
  dio: ^5.8.0+1
  oprino_api:
    path: ../../generated/dart-api

  # Local Persistence & Offline Outbox
  drift: ^2.28.0
  drift_flutter: ^0.2.4
  path_provider: ^2.1.5
  path: ^1.9.0

  # Secure Enclave / Keystore Storage
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - assets/images/

